[package]
name = "carambola-serving"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8.4"
axum = { version = "0.8.1", features = ["macros"] }
base64 = "0.22.1"
chrono = "0.4.39"
chrono-tz = "0.10.0"
derivative = "2.2.0"
ecb = "0.1.2"
flate2 = "1.0.35"
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
hyper = "1.6.0"
hyper-util = "0.1.10"
md5 = "0.7.0"
mysql = "25.0.1"
openssl-sys = "0.9.104"
openssl = { version = "0.10.68", features = ["vendored"] }
r2d2 = "0.8.10"
redis = { version = "0.27.6", features = ["aio", "r2d2", "tokio-comp"] }
reqwest = { version = "0.12.11", features = ["hickory-dns", "gzip", "json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde-aux = "4.5.0"
serde_json = "1.0.134"
serde_yaml = "0.9.34+deprecated"
sha1 = "0.10.6"
tokio = { version = "1.42.0", features = ["full"] }
tokio-cron-scheduler = "0.13.0"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["compression-full"] }
urlencoding = "2.1.3"
uuid = { version = "1.11.0", features = ["v4", "fast-rng"] }
